# KaSe dongle (USB central) — ESB RX + USB HID

# No sleep — USB powered
CONFIG_ZMK_SLEEP=n

# Disable BLE — ESB only, USB HID output
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n

# ESB split transport (central/PRX role)
CONFIG_ZMK_SPLIT_ESB=y
CONFIG_ZMK_SPLIT_ESB_PROTO_TX_ACK=y

# MPSL timeslot (1 = ESB only)
CONFIG_MPSL_TIMESLOT_SESSION_COUNT=1

# Required ESB settings
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_ESB_MAX_PAYLOAD_LENGTH=48
CONFIG_ESB_TX_FIFO_SIZE=1

# 2 peripherals (left + right)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# Battery level from peripherals
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# USB
CONFIG_USB_DEVICE_STACK=y

# ZMK Studio (live keymap editing via USB)
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
