# KaSe left peripheral — ESB transport to dongle

# Deep sleep after 30 minutes
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Disable BLE — ESB only, no host connection from halves
CONFIG_ZMK_BLE=n
CONFIG_ZMK_SPLIT_BLE=n
CONFIG_ZMK_SPLIT_WIRED=n

# ESB split transport
CONFIG_ZMK_SPLIT_ESB=y
CONFIG_ZMK_SPLIT_ESB_PERIPHERAL_ID=1
CONFIG_ZMK_SPLIT_ESB_PROTO_TX_ACK=y

# MPSL timeslot (1 = ESB only, no BLE coexistence)
CONFIG_MPSL_TIMESLOT_SESSION_COUNT=1

# Required ESB settings
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_ESB_MAX_PAYLOAD_LENGTH=48
CONFIG_ESB_TX_FIFO_SIZE=1

# Battery
CONFIG_ZMK_BATTERY_REPORTING=y

# Debounce (BAT54C fast diodes)
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=3
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# NFC pins as GPIO (P0.09 = COL5, P0.10 = SIDE jumper)
CONFIG_NFCT_PINS_AS_GPIOS=y
